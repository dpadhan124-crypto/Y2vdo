<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Wrap Pro</title>
    <!-- Use the local file you downloaded -->
    <script src="ffmpeg.min.js"></script>
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        header { text-align: center; margin-bottom: 30px; }
        header h1 { margin: 0; font-size: 1.5rem; background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        header p { margin: 5px 0 0; color: #94a3b8; font-size: 0.9rem; }

        .upload-section { margin-bottom: 20px; }
        
        .file-input-group {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid transparent;
            transition: all 0.3s ease;
            position: relative;
        }

        .file-input-group:active { transform: scale(0.98); }
        .file-input-group.selected { border-color: var(--primary); background: rgba(0, 242, 254, 0.05); }

        label { display: flex; align-items: center; cursor: pointer; }
        .icon { font-size: 1.5rem; margin-right: 15px; }
        .label-text { flex-grow: 1; }
        .label-text span { display: block; font-size: 0.8rem; color: #94a3b8; margin-top: 2px; }
        
        input[type="file"] { position: absolute; width: 1; height: 1; opacity: 0; }

        .preview-text {
            font-size: 0.75rem;
            color: var(--primary);
            margin-top: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        #generate-btn {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%);
            color: #000;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(79, 172, 254, 0.4);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        #generate-btn:disabled {
            background: #475569;
            box-shadow: none;
            color: #94a3b8;
            cursor: not-allowed;
        }

        .status-container {
            margin-top: 25px;
            display: none;
        }

        .progress-bar {
            height: 6px;
            background: #334155;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .status-msg { font-size: 0.85rem; text-align: center; color: #cbd5e1; }

        /* Animation for loading */
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .loading { animation: pulse 1.5s infinite; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Audio Wrap Pro</h1>
        <p>Convert Story to YouTube Video</p>
    </header>

    <div class="upload-section">
        <!-- Audio Selection -->
        <div class="file-input-group" id="audio-group">
            <label>
                <span class="icon">🎵</span>
                <div class="label-text">
                    Audio Story
                    <span id="audio-hint">MP3 or WAV file</span>
                    <div id="audio-preview" class="preview-text"></div>
                </div>
                <input type="file" id="audio-file" >
            </label>
        </div>

        <!-- Image/GIF Selection -->
        <div class="file-input-group" id="image-group">
            <label>
                <span class="icon">🖼️</span>
                <div class="label-text">
                    Background Visual
                    <span id="image-hint">JPG, PNG, or GIF</span>
                    <div id="image-preview" class="preview-text"></div>
                </div>
                <input type="file" id="image-in">
            </label>
        </div>
    </div>

    <button id="generate-btn">START CONVERSION</button>

    <div class="status-container" id="status-area">
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="status-msg" id="status-msg">Initializing...</div>
    </div>
</div>

<script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    
    // Initialize FFmpeg pointing to your local files
    const ffmpeg = createFFmpeg({ 
        corePath: 'ffmpeg-core.js', // This uses the local file you downloaded
        log: true 
    });

    const audioInput = document.getElementById('audio-file');
    const imageInput = document.getElementById('image-file');
    const generateBtn = document.getElementById('generate-btn');
    const statusArea = document.getElementById('status-area');
    const statusMsg = document.getElementById('status-msg');
    const progressFill = document.getElementById('progress-fill');

    // UI Feedback for file selection
    audioInput.onchange = (e) => {
        if(e.target.files[0]) {
            document.getElementById('audio-preview').innerText = "✅ " + e.target.files[0].name;
            document.getElementById('audio-group').classList.add('selected');
        }
    };

    imageInput.onchange = (e) => {
        if(e.target.files[0]) {
            document.getElementById('image-preview').innerText = "✅ " + e.target.files[0].name;
            document.getElementById('image-group').classList.add('selected');
        }
    };

    generateBtn.onclick = async () => {
        const audio = audioInput.files[0];
        const image = imageInput.files[0];

        if (!audio || !image) {
            alert("Please select both audio and an image!");
            return;
        }

        // Show status UI
        generateBtn.disabled = true;
        statusArea.style.display = 'block';
        statusMsg.innerText = "Loading local FFmpeg engine...";
        progressFill.style.width = "10%";

        try {
            if (!ffmpeg.isLoaded()) {
                await ffmpeg.load();
            }

            statusMsg.innerText = "Reading files...";
            progressFill.style.width = "25%";

            // Write files to FFmpeg virtual memory
            ffmpeg.FS('writeFile', 'audio_src', await fetchFile(audio));
            ffmpeg.FS('writeFile', 'image_src', await fetchFile(image));

            const isGif = image.type === "image/gif";
            statusMsg.innerText = isGif ? "Looping GIF & Merging..." : "Wrapping Audio (Fast Copy)...";
            statusMsg.classList.add('loading');
            progressFill.style.width = "50%";

            // FFmpeg Command Logic
            // -c:a copy makes it incredibly fast because it doesn't re-encode audio
            let command = [];
            if (isGif) {
                command = [
                    '-ignore_loop', '0', 
                    '-i', 'image_src', 
                    '-i', 'audio_src', 
                    '-c:v', 'libx264', 
                    '-shortest', 
                    '-pix_fmt', 'yuv420p', 
                    '-vf', 'pad=ceil(iw/2)*2:ceil(ih/2)*2', // Ensures even dimensions for mobile compatibility
                    'output.mp4'
                ];
            } else {
                command = [
                    '-loop', '1', 
                    '-i', 'image_src', 
                    '-i', 'audio_src', 
                    '-c:v', 'libx264', 
                    '-tune', 'stillimage', 
                    '-c:a', 'copy', // The FAST secret
                    '-shortest', 
                    '-pix_fmt', 'yuv420p', 
                    'output.mp4'
                ];
            }

            await ffmpeg.run(...command);

            progressFill.style.width = "90%";
            statusMsg.innerText = "Finalizing video file...";
            statusMsg.classList.remove('loading');

            const data = ffmpeg.FS('readFile', 'output.mp4');
            const videoBlob = new Blob([data.buffer], { type: 'video/mp4' });
            const url = URL.createObjectURL(videoBlob);

            // Auto-download
            const a = document.createElement('a');
            a.href = url;
            a.download = `YouTube_Story_${Date.now()}.mp4`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            progressFill.style.width = "100%";
            statusMsg.innerText = "Done! Video saved to your device.";
            generateBtn.disabled = false;

        } catch (error) {
            console.error(error);
            statusMsg.innerText = "Error: Use a local server (like Live Server).";
            statusMsg.style.color = "#ff4d4d";
            generateBtn.disabled = false;
        }
    };
</script>

</body>
</html>
